<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Telegram Mini App - Appointments</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      h1 {
        text-align: center;
      }
      #slots-container {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 20px;
      }
      button {
        padding: 10px;
        font-size: 16px;
        cursor: pointer;
      }
      button.booked {
        background-color: #ccc;
        cursor: not-allowed;
      }
      button.selected {
        background-color: #4caf50;
        color: white;
      }
    </style>
  </head>
  <body>
    <h1>Book Your Appointment</h1>
    <div id="slots-container">Loading slots...</div>
    <script src="app.js"></script>
  </body>
</html>
